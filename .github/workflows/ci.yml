name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint and format check (ruff)
        run: |
          ruff check src/ tests/ pipeline/ app.py scripts/
          ruff format --check src/ tests/ pipeline/ app.py scripts/

      # CI runs on the committed fixture only: no data download, no secrets.
      # Full-data tests skip with a clear reason (see tests/*: @requires_full_data).
      - name: Run tests
        run: pytest tests/ -q
